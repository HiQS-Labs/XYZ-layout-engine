# Umbrella GH-19, member GH-9 (runs second). Base: the accepted GH-10 branch head (stacked on PR #18).
# Fire only after the GH-10 lane is accepted. One full clone, one serial lane.
# Codex builder (driver default), independent Agy reviewer. Dispatch: --pre-advance-cmd 'pnpm test'.
# No push, no PR, no merge from builder turns.
name: gh9-responsive-flags
phases:
