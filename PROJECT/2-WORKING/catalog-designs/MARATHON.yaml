    turn_timeout_s: 1500
    max_review_rounds: 2

  - id: gh20-a2-p1
    name: "Designs table, CLI verbs, verify and C4"
    reviewer: agy
    brief: PROJECT/2-WORKING/catalog-designs/briefs/gh20-a2-p1.md
