<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} · XYZ Layout Engine</title>
<style>
{{fonts}}
*{box-sizing:border-box}
:root{--ink:{{ink}};--paper:{{paper}};--accent:{{accent}};--rule:{{rule}};color-scheme:dark}
body{margin:0;background:var(--ink);color:var(--paper);font:normal 20px/1.2 'Barlow Condensed',sans-serif}
main{max-width:1000px;margin:auto;padding:0 0 20px}
header,nav{margin:0 5%}
.mast{display:flex;justify-content:space-between;gap:1em;border-bottom:1px solid var(--rule);padding:20px 0 10px;font-size:clamp(15px,2.2vw,22px);font-weight:bold;letter-spacing:.065em}
.mast span:last-child,.part{color:var(--accent)}
header h1{margin:18px 0 0;font-size:clamp(44px,9.6vw,96px);letter-spacing:-.025em;line-height:1}
.scene{position:relative;overflow:hidden}
.stage{position:relative;width:1000px;transform-origin:top left;height:540px}
.plane{position:absolute;top:0;left:0;width:1000px;height:1000px;transform-origin:top left}
.paper{isolation:isolate}
#canvas{position:relative;line-height:normal;color-scheme:light}
#canvas :is(h1,h2,p){margin:0}
#canvas :is(span,div,p,h1,h2){display:flex}
.split #canvas img{visibility:hidden}
.images{pointer-events:none;background:rgba(211,236,118,var(--tint));outline:4px solid rgba(211,236,118,var(--outline))}
.layout{pointer-events:none;background:rgba(27,61,50,var(--board));outline:4px solid rgba(211,236,118,var(--board))}
.layout svg{display:block;width:100%;height:100%;overflow:visible}
.region-box{fill:none;stroke:var(--rule);stroke-width:4}
.leaf-box{fill:rgba(211,236,118,.1);stroke:var(--accent);stroke-width:7;stroke-dasharray:18 10}
.layout text{fill:var(--accent);font:bold 56px 'Barlow Condensed',sans-serif}
.tech-note{position:absolute;top:440px;left:50px;right:50px}
.tech-note h2{margin:0;font-size:34px;line-height:1.1}
.tech-note p{margin:5px 0 0;font-size:24px}
.tech-note p span{display:inline-block}.tech-note code{color:var(--accent);font:inherit;font-weight:bold}
@media(max-width:600px){.tech-note h2{font-size:42px}.tech-note p{font-size:36px}}
.images img{position:absolute;object-fit:contain}
.guides{position:absolute;top:0;left:0;width:1000px;height:440px;pointer-events:none}
.notes{position:absolute;top:447px;left:50px;right:50px;display:grid;grid-template-columns:1fr 1fr;gap:50px}
.notes h2{font-size:32px;line-height:1.1;margin:0 0 6px}.notes p{margin:0;font-size:22px;line-height:1.2}
.part{padding-right:.35em}
nav{display:flex;align-items:center;gap:16px;padding:14px 0 0;border-top:1px solid var(--rule)}
button{font:inherit;cursor:pointer;padding:6px 14px;min-width:90px;background:var(--accent);color:var(--ink);border:0;border-radius:3px;font-weight:700}
input{accent-color:var(--accent);min-width:20px;flex:1;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
[hidden]{display:none!important}
@media(max-width:600px){nav{gap:8px;font-size:16px}button{min-width:65px}.notes p{display:none}.notes h2{font-size:42px}}
@media print{nav{display:none}main{break-inside:avoid}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><main>
<header><div class="mast"><span>XYZ LAYOUT ENGINE</span><span>NUTRITION v4.1</span></div><h1>{{title}}</h1></header>
<div class="scene"><div class="stage">
<svg aria-hidden="true" class="guides" viewBox="0 0 1000 440"><path d="M74 160L899 25 M74 348L899 394" fill="none" stroke="var(--rule)" stroke-dasharray="5 7"/></svg>
<div class="plane paper">{{poster}}</div>
<div class="plane layout" hidden aria-hidden="true"><svg viewBox="0 0 1000 1000">{{boxes}}
<g class="slot-name" text-anchor="middle"><text x="50%" y="42%">#hero_img</text>
<text x="50%" y="49%" style="font-size:43px">{{width}} × {{height}}</text></g></svg></div>
<div class="plane images" aria-hidden="true"></div>
<svg aria-hidden="true" class="guides" viewBox="0 0 1000 440"><g fill="none" stroke="var(--accent)" stroke-width="2"><path d="M226 91H72V438 M706 224H883V407H547V438"/></g><g fill="var(--ink)" stroke="var(--accent)" stroke-width="3"><circle cx="226" cy="91" r="6"/><circle cx="706" cy="224" r="6"/></g></svg>
<section class="notes"><div><h2><span class="part">A</span>Change the words</h2><p>{{text}}</p></div><div><h2><span class="part">B</span>Swap the leaf</h2><p>{{art}}</p></div></section>
<section class="tech-note" hidden><h2><span class="part">C</span>JavaScript defines the layout. CSS places the leaf.</h2>
<p><span>Recipe <code>{ left: {{jsLeft}}, top: {{jsTop}} }</code></span> <span>→ inline CSS <code>left: {{left}}; top: {{top}};</code></span></p></section>
</div></div>
<nav aria-label="Assembly playback" hidden><button type="button">Assemble</button><span>Exploded</span><input type="range" min="0" max="1000" value="0" aria-label="Assembly progress"><span>Assembled</span></nav>
</main><script type="application/json" id="slots">{{slots}}</script><script type="application/json" id="settings">{{recipe}}</script>
<noscript><style>.stage{width:100%;height:auto}.paper{position:static;width:100%;height:auto}.scene{overflow:auto}.notes,.guides,.images{display:none}</style></noscript>
<script>{{script}}</script></body></html>
